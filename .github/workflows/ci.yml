name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Tests — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [availability, bookings, notifications]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Cache Composer vendor
        uses: actions/cache@v4
        with:
          path: services/${{ matrix.service }}/vendor
          key: ${{ runner.os }}-composer-${{ matrix.service }}-${{ hashFiles('services/${{ matrix.service }}/composer.lock') }}

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
        working-directory: services/${{ matrix.service }}

      - name: Run PHPUnit
        run: vendor/bin/phpunit -c phpunit.xml --colors=always
        working-directory: services/${{ matrix.service }}
