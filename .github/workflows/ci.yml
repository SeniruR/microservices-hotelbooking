name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Tests — ${{ matrix.service }}
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: homestead
      DB_USERNAME: homestead
      DB_PASSWORD: secret
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: homestead
          MYSQL_USER: homestead
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    strategy:
      fail-fast: false
      matrix:
        service: [availability, bookings, notifications]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare writable directories
        run: |
          set -e
          mkdir -p services/${{ matrix.service }}/bootstrap/cache
          mkdir -p services/${{ matrix.service }}/storage/framework/{cache,sessions,views}
          mkdir -p services/${{ matrix.service }}/storage/logs
          chmod -R 0777 services/${{ matrix.service }}/bootstrap/cache services/${{ matrix.service }}/storage || true

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, xml

      - name: Cache Composer vendor
        uses: actions/cache@v4
        with:
          path: services/${{ matrix.service }}/vendor
          key: "${{ runner.os }}-composer-${{ matrix.service }}-${{ hashFiles('services/${{ matrix.service }}/composer.lock') }}"

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
        working-directory: services/${{ matrix.service }}

      - name: Wait for MySQL
        run: |
          php -r '
          $tries=0;
          while($tries<30){
            try{
              new PDO("mysql:host=127.0.0.1;port=3306;dbname=homestead","homestead","secret");
              echo "MySQL is up\n";
              exit(0);
            }catch(PDOException $e){
              $tries++;
              sleep(1);
            }
          }
          exit(1);
          '
        working-directory: services/${{ matrix.service }}

      - name: Ensure .env exists and DB config
        run: |
          set -e
          cd services/${{ matrix.service }}
          if [ -f .env.example ]; then
            cp .env.example .env || true
          fi
          if [ ! -f .env ]; then
            printf "%s\n" \
              "APP_ENV=testing" \
              "APP_DEBUG=true" \
              "APP_KEY=" \
              "DB_CONNECTION=mysql" \
              "DB_HOST=127.0.0.1" \
              "DB_PORT=3306" \
              "DB_DATABASE=homestead" \
              "DB_USERNAME=homestead" \
              "DB_PASSWORD=secret" > .env
          fi
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env || true
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env || true
          sed -i 's/^DB_PORT=.*/DB_PORT=3306/' .env || true
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=homestead/' .env || true
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=homestead/' .env || true
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=secret/' .env || true

      - name: Generate APP_KEY
        run: php artisan key:generate --ansi --force
        working-directory: services/${{ matrix.service }}

      - name: Run migrations
        run: php artisan migrate --force
        working-directory: services/${{ matrix.service }}

      - name: Run PHPUnit
        run: vendor/bin/phpunit -c phpunit.xml --colors=always
        working-directory: services/${{ matrix.service }}
