server {
  listen 80;
  server_name _;

  # Simple path-based routing for local dev.
  location = /availability {
    return 301 /availability/;
  }
  location /availability/ {
    # forward the original Host header (including port) so upstream apps
    # generate redirects and absolute URLs with the correct host:port
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://availability:8000/;
  }

  location = /bookings {
    return 301 /bookings/;
  }
  location /bookings/ {
    # forward the original Host header (including port)
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://bookings:8000/;
  }

  location = /notifications {
    return 301 /notifications/;
  }
  location /notifications/ {
    # forward the original Host header (including port)
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://notifications:8000/;
  }

  location = / {
    default_type text/plain;
    return 200 "OK - gateway. Try /availability, /bookings, /notifications\n";
  }
}
